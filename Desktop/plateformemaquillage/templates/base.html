<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}M'Elle Make Up{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #faf9f7;
            min-height: 100vh;
            color: #333;
        }
        
        header {
            background: linear-gradient(135deg, #d4a574 0%, #a67c52 100%);
            color: white;
            padding: 3rem 1.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        
        nav {
            background: white;
            padding: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        nav a {
            color: #a67c52;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            border: 2px solid transparent;
        }
        
        nav a:hover {
            background: #d4a574;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 165, 116, 0.3);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .messages {
            list-style: none;
        }
        
        .messages li {
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            animation: slideDown 0.4s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .messages li.error {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        
        main {
            background: white;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        
        main h2 {
            font-family: 'Playfair Display', serif;
            color: #a67c52;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            letter-spacing: 0.5px;
        }
        
        footer {
            text-align: center;
            color: #999;
            margin-top: 3rem;
            padding: 2rem 1rem;
            border-top: 1px solid #eee;
            font-size: 0.95rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <h1>✨ M'Elle Make Up ✨</h1>
        <p>Réservez votre rendez-vous</p>
    </header>
    
    <nav>
        <a href="{% url 'accueil' %}">Accueil</a>
        <a href="{% url 'mes_rendez_vous' %}">Mes Rendez-vous</a>
    </nav>
    
    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <footer>
        <p>&copy; 2025 M'Elle Make Up. Tous droits réservés.</p>
    </footer>
</body>
</html>
